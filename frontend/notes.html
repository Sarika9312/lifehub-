<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes - LifeHub</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="app-container">
    <nav class="sidebar">
      <div class="logo">🏠 LifeHub</div>
      <ul class="nav-menu">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="expenses.html">💰 Expenses</a></li>
        <li><a href="bills.html">📋 Bills</a></li>
        <li><a href="medicine.html">💊 Medicines</a></li>
        <li><a href="groceries.html">🛒 Groceries</a></li>
        <li><a href="tasks.html">✓ Tasks</a></li>
        <li><a href="documents.html">📄 Documents</a></li>
        <li><a href="budget.html">📈 Budget</a></li>
        <li><a href="notes.html" class="active">📝 Notes</a></li>
        <li><a href="settings.html">⚙️ Settings</a></li>
      </ul>
      <button onclick="logout()" class="btn btn-danger">Logout</button>
    </nav>

    <div class="main-content">
      <div class="header">
        <h1>Personal Notes</h1>
      </div>

      <div class="notes-container">
        <div class="note-input">
          <textarea id="noteContent" placeholder="Write your note here..."></textarea>
          <button onclick="saveNote()" class="btn btn-primary">Save Note</button>
        </div>

        <div class="notes-list">
          <h2>My Notes</h2>
          <div id="notesList">
            <p>Notes are stored locally in your browser.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Local storage based notes
    function loadNotes() {
      const notesList = document.getElementById('notesList');
      const notes = JSON.parse(localStorage.getItem('notes') || '[]');
      
      if (notes.length === 0) {
        notesList.innerHTML = '<p>No notes yet. Create one!</p>';
        return;
      }

      notesList.innerHTML = notes.map((note, idx) => `
        <div class="note-card">
          <p>${note}</p>
          <button onclick="deleteNote(${idx})" class="btn btn-danger small">Delete</button>
        </div>
      `).join('');
    }

    function saveNote() {
      const content = document.getElementById('noteContent').value.trim();
      if (!content) {
        alert('Please write something!');
        return;
      }

      const notes = JSON.parse(localStorage.getItem('notes') || '[]');
      notes.push(content);
      localStorage.setItem('notes', JSON.stringify(notes));
      document.getElementById('noteContent').value = '';
      loadNotes();
    }

    function deleteNote(idx) {
      const notes = JSON.parse(localStorage.getItem('notes') || '[]');
      notes.splice(idx, 1);
      localStorage.setItem('notes', JSON.stringify(notes));
      loadNotes();
    }

    loadNotes();
  </script>
</body>
</html>
