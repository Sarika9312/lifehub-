<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - LifeHub</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>🏠 LifeHub</h1>
      <h2>Sign Up</h2>
      <form id="signupForm">
        <div class="form-group">
          <label for="country">Select Country</label>
          <select id="country" name="country" required>
            <option value="">-- Select Country --</option>
            <option value="US">United States (USD)</option>
            <option value="GB">United Kingdom (GBP)</option>
            <option value="DE">Germany (EUR)</option>
            <option value="FR">France (EUR)</option>
            <option value="IN">India (INR)</option>
            <option value="AU">Australia (AUD)</option>
            <option value="CA">Canada (CAD)</option>
            <option value="SG">Singapore (SGD)</option>
            <option value="AE">United Arab Emirates (AED)</option>
            <option value="JP">Japan (JPY)</option>
            <option value="CH">Switzerland (CHF)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign Up</button>
      </form>
      <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
      <p class="auth-link"><a href="index.html">Back to home</a></p>
      <div id="message"></div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script>
    const countryCurrencyMap = {
      US: 'USD', GB: 'GBP', DE: 'EUR', FR: 'EUR', IN: 'INR',
      AU: 'AUD', CA: 'CAD', SG: 'SGD', AE: 'AED', JP: 'JPY', CH: 'CHF'
    };

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const country = document.getElementById('country').value;
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');

      if (!country) {
        messageDiv.innerHTML = '<p style="color: red;">Please select a country</p>';
        return;
      }

      const currency = countryCurrencyMap[country];

      try {
        const response = await fetch('http://localhost:5000/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, country, currency })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          localStorage.setItem('country', country);
          localStorage.setItem('budgetCurrency', currency);
          messageDiv.innerHTML = '<p style="color: green;">Sign up successful! Redirecting...</p>';
          setTimeout(() => window.location.href = 'dashboard.html', 1000);
        } else {
          messageDiv.innerHTML = `<p style="color: red;">${data.message}</p>`;
        }
      } catch (error) {
        messageDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
      }
    });
  </script>
</body>
</html>
