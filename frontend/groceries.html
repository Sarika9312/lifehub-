<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groceries - LifeHub</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="app-container">
    <nav class="sidebar">
      <div class="logo">🏠 LifeHub</div>
      <ul class="nav-menu">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="expenses.html">💰 Expenses</a></li>
        <li><a href="bills.html">📋 Bills</a></li>
        <li><a href="medicine.html">💊 Medicines</a></li>
        <li><a href="groceries.html" class="active">🛒 Groceries</a></li>
        <li><a href="tasks.html">✓ Tasks</a></li>
        <li><a href="documents.html">📄 Documents</a></li>
        <li><a href="budget.html">📈 Budget</a></li>
        <li><a href="notes.html">📝 Notes</a></li>
        <li><a href="settings.html">⚙️ Settings</a></li>
      </ul>
      <button onclick="logout()" class="btn btn-danger">Logout</button>
    </nav>

    <div class="main-content">
      <div class="header">
        <h1>Shopping & Groceries</h1>
      </div>

      <div class="add-form">
        <h3>Add Grocery Item</h3>
        <form id="groceryForm">
          <div class="form-row">
            <div class="form-group">
              <label for="item">Item Name</label>
              <input type="text" id="item" name="item" required>
            </div>
            <div class="form-group">
              <label for="quantity">Quantity</label>
              <input type="number" id="quantity" name="quantity" min="1" required>
            </div>
            <div class="form-group">
              <label for="unit">Unit</label>
              <select id="unit" name="unit">
                <option value="pieces">Pieces</option>
                <option value="kg">KG</option>
                <option value="liter">Liter</option>
                <option value="dozen">Dozen</option>
                <option value="box">Box</option>
                <option value="pack">Pack</option>
              </select>
            </div>
            <div class="form-group">
              <label for="priority">Priority</label>
              <select id="priority" name="priority">
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" name="category">
                <option value="Vegetables">Vegetables</option>
                <option value="Fruits">Fruits</option>
                <option value="Dairy">Dairy</option>
                <option value="Meat">Meat</option>
                <option value="Grains">Grains</option>
                <option value="Spices">Spices</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Add Item</button>
          </div>
        </form>
      </div>

      <div class="alerts-section">
        <div id="lowStockAlert" class="alert-box"></div>
      </div>

      <div class="list-section">
        <h2>Shopping List</h2>
        <div id="groceriesList" class="list-container">
          <p>Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/groceries.js"></script>
</body>
</html>
